<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Raw Link</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 30px; }
        .container { background-color: #222; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #facc15; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, textarea { width: 100%; padding: 10px; background-color: #000; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-family: monospace; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #facc15; color: black; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #eab308; }
        #result-box { display: none; margin-top: 20px; background: #000; padding: 15px; border-radius: 5px; border: 1px solid #4ade80; text-align: center; }
        #result-link { color: #4ade80; font-weight: bold; word-break: break-all; text-decoration: none; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Raw Link</h2>

        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên...">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>

        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>

        <button onclick="createLink()" id="btn-create">Create raw link</button>

        <div id="result-box">
            <p style="color:white; margin:0;">Link của bạn (Click để mở):</p>
            <a id="result-link" target="_blank"></a>
            <br>
            <button onclick="copyLink()" style="background:#4ade80; padding:8px; font-size:14px; margin-top:10px;">Copy Link</button>
        </div>
    </div>

    <script>
        async function createLink() {
            // ==========================================
            // GẮN TOKEN CỦA BẠN VÀO ĐÂY (Thay dòng dưới)
            // ==========================================
            const token = "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"; 
            
            const name = document.getElementById('url-name').value.trim();
            const password = document.getElementById('password').value;
            const extra = document.getElementById('extra-input').value;
            const code = document.getElementById('script-code').value;

            if (!name || !password || !code) {
                alert("Vui lòng nhập đầy đủ Tên, Mật khẩu và Code!");
                return;
            }

            const btn = document.getElementById('btn-create');
            btn.innerText = "⏳ Đang tạo link..."; btn.disabled = true;

            const randomId = Math.random().toString(36).substring(2, 10);
            const fileName = `${name}_${randomId}.lua`;
            const fileContent = `-- Tên: ${name}\n-- Mật khẩu: ${password}\n-- Input phụ: ${extra}\n\n${code}`;

            try {
                const response = await fetch('https://api.github.com/gists', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        description: `Raw Script - ${name}`,
                        public: true, 
                        files: {
                            [fileName]: { content: fileContent }
                        }
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const rawUrl = data.files[fileName].raw_url;
                    document.getElementById('result-box').style.display = 'block';
                    const linkEl = document.getElementById('result-link');
                    linkEl.href = rawUrl;
                    linkEl.innerText = rawUrl;
                } else {
                    alert("Lỗi: " + data.message + "\n(Kiểm tra lại Token xem có đúng không)");
                }
            } catch (error) {
                alert("Lỗi kết nối mạng!");
            }

            btn.innerText = "Create raw link"; btn.disabled = false;
        }

        function copyLink() {
            const link = document.getElementById('result-link').href;
            navigator.clipboard.writeText(link).then(() => alert("Đã copy link!"));
        }
    </script>
</body>
</html>
