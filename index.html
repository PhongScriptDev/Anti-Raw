<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Raw Link</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #facc15;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #eab308; }
        
        #result-box {
            margin-top: 20px;
            display: none;
            background-color: #000;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #4ade80;
            text-align: center;
        }
        #result-link {
            color: #4ade80;
            font-size: 16px;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Raw Link</h2>

        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên URL...">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>

        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>

        <button onclick="createLink()">Create raw link</button>

        <div id="result-box">
            <p>Link của bạn:</p>
            <div id="result-link"></div>
        </div>
    </div>

    <script>
        function createLink() {
            const name = document.getElementById('url-name').value;
            const password = document.getElementById('password').value;
            const extra = document.getElementById('extra-input').value;
            const code = document.getElementById('script-code').value;

            if (!name || !password || !code) {
                alert("Vui lòng nhập đầy đủ Tên URL, Mật khẩu và Code!");
                return;
            }

            // Tạo chuỗi ký tự ngẫu nhiên dài tối đa 17 ký tự
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomString = '';
            for (let i = 0; i < 17; i++) {
                randomString += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // Tạo link
            const baseUrl = "https://aur_meow.com/anti-raw/";
            const finalUrl = baseUrl + randomString;

            // Hiển thị kết quả
            const resultBox = document.getElementById('result-box');
            const resultLink = document.getElementById('result-link');
            
            resultLink.innerText = finalUrl;
            resultBox.style.display = 'block';
            
            // Lưu tạm dữ liệu (nếu bạn cần dùng sau này)
            const dataToSave = {
                urlName: name,
                password: password,
                extraInput: extra,
                code: code,
                generatedLink: finalUrl
            };
            console.log("Dữ liệu đã tạo:", dataToSave);
        }
    </script>
</body>
</html>
