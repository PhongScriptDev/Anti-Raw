<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Raw Link</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        .container {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #facc15; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #facc15;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #eab308; }
        
        #result-box {
            margin-top: 20px;
            display: none;
            background-color: #000;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #4ade80;
            text-align: center;
        }
        #result-link {
            color: #4ade80;
            font-size: 14px;
            font-weight: bold;
            word-break: break-all;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Raw Link</h2>
        <p style="text-align:center; color:#aaa; font-size:12px; margin-bottom:20px;">(Dữ liệu sẽ được lưu vào link, không cần server)</p>

        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên URL...">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>

        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>

        <button onclick="createLink()">Create raw link</button>

        <div id="result-box">
            <p>Link của bạn (Bấm vào để mở):</p>
            <a id="result-link" target="_blank"></a>
            <br><br>
            <button onclick="copyLink()" style="background:#4ade80; padding:8px; font-size:14px;">Copy Link</button>
        </div>
    </div>

    <script>
        // Hàm mã hóa Base64 hỗ trợ tiếng Việt
        function encodeData(str) {
            return btoa(encodeURIComponent(str));
        }

        // Hàm giải mã Base64
        function decodeData(str) {
            return decodeURIComponent(atob(str));
        }

        // 1. TẠO LINK
        function createLink() {
            const name = document.getElementById('url-name').value;
            const password = document.getElementById('password').value;
            const extra = document.getElementById('extra-input').value;
            const code = document.getElementById('script-code').value;

            if (!name || !password || !code) {
                alert("Vui lòng nhập đầy đủ Tên URL, Mật khẩu và Code!");
                return;
            }

            // Gom dữ liệu thành một Object
            const data = {
                n: name,
                p: password,
                e: extra,
                c: code
            };

            // Mã hóa dữ liệu thành chuỗi
            const encodedData = encodeData(JSON.stringify(data));

            // Tạo link ngẫu nhiên 17 ký tự (như bạn muốn)
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomString = '';
            for (let i = 0; i < 17; i++) {
                randomString += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // Ghép link: Tên miền hiện tại + tên ngẫu nhiên + dấu # + dữ liệu
            // Dùng window.location.origin để lấy đúng tên miền bạn đang dùng (ví dụ: criptdev.github.io)
            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?id=${randomString}#data=${encodedData}`;

            // Hiển thị kết quả
            const resultBox = document.getElementById('result-box');
            const resultLink = document.getElementById('result-link');
            
            resultLink.href = finalUrl;
            resultLink.innerText = finalUrl;
            resultBox.style.display = 'block';
        }

        // 2. COPY LINK
        function copyLink() {
            const linkText = document.getElementById('result-link').href;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Đã copy link!");
            });
        }

        // 3. TỰ ĐỘNG ĐIỀN KHI TRUY CẬP LINK
        window.onload = function() {
            // Lấy phần dữ liệu sau dấu #
            if (window.location.hash && window.location.hash.startsWith('#data=')) {
                try {
                    const encodedData = window.location.hash.replace('#data=', '');
                    const decodedString = decodeData(encodedData);
                    const data = JSON.parse(decodedString);

                    // Điền lại vào form
                    document.getElementById('url-name').value = data.n || '';
                    document.getElementById('password').value = data.p || '';
                    document.getElementById('extra-input').value = data.e || '';
                    document.getElementById('script-code').value = data.c || '';

                    // Thông báo
                    alert("Đã tải dữ liệu từ link thành công!");
                } catch(e) {
                    console.error("Lỗi giải mã link:", e);
                }
            }
        };
    </script>
</body>
</html>
