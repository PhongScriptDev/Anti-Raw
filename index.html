<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Raw Link</title>
    <style>
        /* GIAO DIỆN FORM TẠO LINK (NỀN TỐI) */
        body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        .container {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #facc15; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #000;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
        }
        textarea { height: 120px; resize: vertical; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #facc15;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #eab308; }

        /* GIAO DIỆN TRANG RAW (NỀN TRẮNG) */
        #raw-view {
            display: none; /* Ẩn mặc định, chỉ hiện khi có link */
            background-color: #ffffff;
            color: #000000;
            font-family: monospace;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }
        .raw-header {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-family: sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .raw-title { font-size: 18px; font-weight: bold; color: #333; }
        .raw-code {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <!-- FORM TẠO LINK -->
    <div class="container" id="create-form">
        <h2>Create Raw Link</h2>

        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên (ví dụ: phongscript)...">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>

        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>

        <button onclick="createAndRedirect()">Create raw link</button>
    </div>

    <!-- TRANG RAW (CHỈ HIỆN KHI TRUY CẬP LINK) -->
    <div id="raw-view">
        <div class="raw-header">
            <div class="raw-title" id="raw-title">Raw Script</div>
            <div id="raw-user" style="color: #666; font-size: 14px;"></div>
        </div>
        <div class="raw-code" id="raw-code"></div>
    </div>

    <script>
        // 1. HÀM TẠO MÃ NGẪU NHIÊN 10 KÝ TỰ (SỐ + CHỮ)
        function generateRandomId(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 2. HÀM TẠO LINK VÀ CHUYỂN HƯỚNG
        function createAndRedirect() {
            const name = document.getElementById('url-name').value.trim();
            const password = document.getElementById('password').value;
            const extra = document.getElementById('extra-input').value;
            const code = document.getElementById('script-code').value;

            if (!name || !password || !code) {
                alert("Vui lòng nhập đầy đủ Tên URL, Mật khẩu và Code!");
                return;
            }

            // Xóa khoảng trắng trong tên user (để link đẹp hơn)
            const safeName = name.replace(/\s+/g, '_');

            // Tạo 10 ký tự ngẫu nhiên
            const randomId = generateRandomId(10);

            // Lưu dữ liệu vào bộ nhớ tạm (LocalStorage) với ID là key
            // Cách này giúp link không bị dài, chỉ cần ID là đủ
            const dataToSave = {
                name: safeName,
                password: password,
                extra: extra,
                code: code
            };
            localStorage.setItem('raw_' + randomId, JSON.stringify(dataToSave));

            // Tạo URL mới dựa trên tên miền hiện tại
            // Dạng: https://phongscriptdev.github.io/Anti-Raw/tenuser/randomid
            const baseUrl = window.location.origin + window.location.pathname;
            
            // Đảm bảo baseUrl không bị dư dấu / ở cuối
            const cleanBaseUrl = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl;
            const finalUrl = `${cleanBaseUrl}/${safeName}/${randomId}`;

            // Chuyển hướng ngay lập tức đến link vừa tạo
            window.location.href = finalUrl;
        }

        // 3. HÀM KIỂM TRA VÀ HIỂN THỊ TRANG RAW KHI CÓ LINK
        window.onload = function() {
            // Lấy đường dẫn hiện tại (ví dụ: /Anti-Raw/tenuser/randomid)
            const pathParts = window.location.pathname.split('/').filter(p => p !== '');
            
            // Nếu đường dẫn có ít nhất 2 phần (tên user và ID)
            if (pathParts.length >= 2) {
                // Lấy ID cuối cùng trên URL
                const rawId = pathParts[pathParts.length - 1];
                const userName = pathParts[pathParts.length - 2];

                // Lấy dữ liệu từ LocalStorage
                const savedDataStr = localStorage.getItem('raw_' + rawId);

                if (savedDataStr) {
                    const data = JSON.parse(savedDataStr);

                    // Ẩn form tạo link
                    document.getElementById('create-form').style.display = 'none';

                    // Hiện trang raw nền trắng
                    document.getElementById('raw-view').style.display = 'block';

                    // Điền thông tin
                    document.getElementById('raw-title').innerText = "Raw Code: " + data.name;
                    document.getElementById('raw-user').innerText = "User: " + userName;
                    document.getElementById('raw-code').innerText = data.code;
                } else {
                    // Nếu link không tồn tại trong bộ nhớ
                    document.body.innerHTML = `
                        <div style="color: white; background: #111; text-align: center; padding: 50px; width: 100%; height: 100vh; font-family: sans-serif;">
                            <h1 style="color: #ef4444;">404 - Không tìm thấy Code</h1>
                            <p>Link này không tồn tại hoặc đã bị xóa khỏi bộ nhớ trình duyệt.</p>
                            <p style="color: #666; font-size: 12px; margin-top: 20px;">Lưu ý: Dữ liệu này chỉ tồn tại trên trình duyệt đã tạo ra nó.</p>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
