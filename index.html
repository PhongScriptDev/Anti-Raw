<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Code</title>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      // CẤU HÌNH FIREBASE
      const firebaseConfig = {
        apiKey: "AIzaSyBHJpsXdmdwxDlf3ejFCkU084RSDbNFsM",
        authDomain: "anti-raw.firebaseapp.com",
        databaseURL: "https://anti-raw-default-rtdb.firebaseio.com",
        projectId: "anti-raw",
        storageBucket: "anti-raw.firebasestorage.app",
        messagingSenderId: "774620109202",
        appId: "1:774620109202:web:48414d935beb000a5c894b"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // Hàm tạo ID ngẫu nhiên
      function generateRandomId(length) {
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          let result = '';
          for (let i = 0; i < length; i++) {
              result += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          return result;
      }

      // 1. HÀM TẠO LINK
      window.createAndRedirect = async function() {
          const name = document.getElementById('url-name').value.trim();
          const password = document.getElementById('password').value;
          const extra = document.getElementById('extra-input').value;
          const code = document.getElementById('script-code').value;

          if (!name || !password || !code) {
              alert("Vui lòng nhập đầy đủ Tên URL, Mật khẩu và Code!");
              return;
          }

          const safeName = name.replace(/\s+/g, '_');
          const randomId = generateRandomId(10);
          const btn = document.querySelector('button');
          btn.innerText = "⏳ Đang tạo link..."; btn.disabled = true;

          try {
              // Lưu lên Firebase
              await set(ref(db, 'raw_scripts/' + randomId), {
                  name: safeName,
                  password: password,
                  extra: extra,
                  code: code
              });

              let baseUrl = window.location.origin + window.location.pathname;
              baseUrl = baseUrl.split('?')[0]; 
              if (baseUrl.endsWith('.html')) baseUrl = baseUrl.replace('.html', '');
              if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

              // Chuyển hướng đến link mới
              window.location.href = `${baseUrl}/?user=${safeName}&id=${randomId}`;
          } catch (error) {
              alert("Lỗi khi lưu lên Firebase: " + error.message);
              btn.innerText = "Create raw link"; btn.disabled = false;
          }
      };

      // 2. HÀM HIỂN THỊ CODE (RAW GITHUB STYLE)
      window.onload = async function() {
          const urlParams = new URLSearchParams(window.location.search);
          const rawId = urlParams.get('id');

          // Nếu có ID trên URL -> Chuyển sang chế độ Raw
          if (rawId) {
              try {
                  const snapshot = await get(ref(db, 'raw_scripts/' + rawId));
                  
                  if (snapshot.exists()) {
                      const data = snapshot.val();

                      // XÓA SẠCH HTML, CHỈ GIỮ LẠI CODE
                      document.documentElement.innerHTML = "";
                      // Thêm thẻ meta để trình duyệt hiển thị dạng text
                      let meta = document.createElement('meta');
                      meta.name = "viewport";
                      meta.content = "width=device-width, initial-scale=1.0";
                      document.head.appendChild(meta);
                      
                      // Đưa code vào thẻ body
                      document.body.innerText = data.code;
                      
                      // CSS cho giống GitHub Raw
                      document.body.style.margin = "0";
                      document.body.style.padding = "16px";
                      document.body.style.backgroundColor = "#ffffff";
                      document.body.style.color = "#24292e";
                      document.body.style.fontFamily = "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace";
                      document.body.style.fontSize = "12px";
                      document.body.style.whiteSpace = "pre-wrap";
                      document.body.style.wordWrap = "break-word";
                      return;
                  } else {
                      document.body.innerHTML = "<h1 style='font-family:sans-serif; text-align:center; margin-top:50px;'>404 Not Found</h1>";
                      document.body.style.display = 'flex';
                  }
              } catch (error) {
                  document.body.innerHTML = "<h1 style='font-family:sans-serif; text-align:center; margin-top:50px;'>Lỗi kết nối Database</h1>";
                  document.body.style.display = 'flex';
              }
          } else {
              // Nếu không có ID (vào trang chủ) -> Hiện giao diện tạo link
              document.body.style.display = 'flex';
          }
      };
    </script>
    <style>
        /* BAN ĐẦU ẨN BODY ĐỂ TRÁNH CHỚP GIAO DIỆN */
        body { display: none; background-color: #111; color: white; font-family: sans-serif; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 30px; }
        
        .container { background-color: #222; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #facc15; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, textarea { width: 100%; padding: 10px; background-color: #000; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-family: monospace; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #facc15; color: black; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #eab308; }
    </style>
</head>
<body>

    <div class="container" id="create-form">
        <h2>Create Raw Link</h2>
        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên...">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>
        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>
        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>
        <button onclick="createAndRedirect()">Create raw link</button>
    </div>

</body>
</html>
