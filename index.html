<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Raw Link</title>
    <!-- Nhúng thư viện Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      // CẤU HÌNH FIREBASE CỦA BẠN ĐÃ ĐƯỢC ĐIỀN SẴN
      const firebaseConfig = {
        apiKey: "AIzaSyBHJpsXdmdwxDlf3ejFCkU084RSDbNFsM",
        authDomain: "anti-raw.firebaseapp.com",
        databaseURL: "https://anti-raw-default-rtdb.firebaseio.com",
        projectId: "anti-raw",
        storageBucket: "anti-raw.firebasestorage.app",
        messagingSenderId: "774620109202",
        appId: "1:774620109202:web:48414d935beb000a5c894b"
      };

      // Khởi tạo Firebase
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // Hàm tạo mã ngẫu nhiên 10 ký tự
      function generateRandomId(length) {
          const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
          let result = '';
          for (let i = 0; i < length; i++) {
              result += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          return result;
      }

      // Hàm tạo link
      window.createAndRedirect = async function() {
          const name = document.getElementById('url-name').value.trim();
          const password = document.getElementById('password').value;
          const extra = document.getElementById('extra-input').value;
          const code = document.getElementById('script-code').value;

          if (!name || !password || !code) {
              alert("Vui lòng nhập đầy đủ Tên URL, Mật khẩu và Code!");
              return;
          }

          const safeName = name.replace(/\s+/g, '_');
          const randomId = generateRandomId(10);

          const btn = document.querySelector('button');
          btn.innerText = "⏳ Đang tạo link..."; btn.disabled = true;

          try {
              // Lưu dữ liệu lên Firebase
              await set(ref(db, 'raw_scripts/' + randomId), {
                  name: safeName,
                  password: password,
                  extra: extra,
                  code: code
              });

              // Lấy đường dẫn gốc
              let baseUrl = window.location.origin + window.location.pathname;
              baseUrl = baseUrl.split('?')[0]; 
              if (baseUrl.endsWith('.html')) baseUrl = baseUrl.replace('.html', '');
              if (baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);

              // Chuyển hướng
              window.location.href = `${baseUrl}/?user=${safeName}&id=${randomId}`;
          } catch (error) {
              alert("Lỗi khi lưu lên Firebase: " + error.message + "\n(Hãy chắc chắn bạn đã bật Realtime Database ở chế độ Test Mode)");
              btn.innerText = "Create raw link"; btn.disabled = false;
          }
      };

      // Hàm hiển thị code khi truy cập link
      window.onload = async function() {
          const urlParams = new URLSearchParams(window.location.search);
          const rawId = urlParams.get('id');
          const userName = urlParams.get('user');

          if (rawId) {
              try {
                  // Lấy dữ liệu từ Firebase
                  const snapshot = await get(ref(db, 'raw_scripts/' + rawId));
                  
                  if (snapshot.exists()) {
                      const data = snapshot.val();
                      
                      document.getElementById('create-form').style.display = 'none';
                      document.body.style.backgroundColor = '#fff'; 
                      document.body.style.padding = '0';
                      document.getElementById('raw-view').style.display = 'block';
                      document.getElementById('raw-title').innerText = "Raw Code: " + data.name;
                      document.getElementById('raw-user').innerText = "Created by: " + userName;
                      document.getElementById('raw-code').innerText = data.code;
                  } else {
                      show404();
                  }
              } catch (error) {
                  show404();
              }
          }
      };

      function show404() {
          document.body.innerHTML = `
              <div style="color: #333; text-align: center; padding: 50px; width: 100%; height: 100vh; font-family: sans-serif; background: #fff;">
                  <h1 style="color: #ef4444;">404 - Không tìm thấy Code</h1>
                  <p>Link này không tồn tại hoặc đã bị xóa.</p>
                  <a href="/" style="display: inline-block; margin-top: 20px; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 5px;">Quay lại</a>
              </div>
          `;
      }
    </script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 30px; }
        .container { background-color: #222; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #facc15; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, textarea { width: 100%; padding: 10px; background-color: #000; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-family: monospace; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #facc15; color: black; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #eab308; }

        #raw-view { display: none; background-color: #ffffff; color: #000000; font-family: monospace; position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: auto; padding: 20px; box-sizing: border-box; z-index: 100; }
        .raw-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; font-family: sans-serif; display: flex; justify-content: space-between; align-items: center; }
        .raw-title { font-size: 18px; font-weight: bold; color: #333; }
        .raw-code { white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.5; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <!-- FORM TẠO LINK -->
    <div class="container" id="create-form">
        <h2>Create Raw Link</h2>

        <div class="form-group">
            <label>Tên URL:</label>
            <input type="text" id="url-name" placeholder="Nhập tên (ví dụ: phongscript)...">
        </div>

        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu...">
        </div>

        <div class="form-group">
            <label>Input phụ:</label>
            <input type="text" id="extra-input" placeholder="Nhập input phụ...">
        </div>

        <div class="form-group">
            <label>Code:</label>
            <textarea id="script-code" placeholder="Dán code vào đây..."></textarea>
        </div>

        <button onclick="createAndRedirect()">Create raw link</button>
    </div>

    <!-- TRANG RAW (CHỈ HIỆN KHI TRUY CẬP LINK) -->
    <div id="raw-view">
        <div class="raw-header">
            <div class="raw-title" id="raw-title">Raw Script</div>
            <div id="raw-user" style="color: #666; font-size: 14px;"></div>
        </div>
        <div class="raw-code" id="raw-code"></div>
    </div>

</body>
</html>
